<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Bitis's Management System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style data-purpose="typography">
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8F9FA;
        }
    </style>
    <style data-purpose="custom-layout">
        .sidebar-active {
            background-color: rgba(255, 255, 255, 0.1);
            border-left: 4px solid #E30016;
        }

        .chart-container {
            height: 300px;
        }
    </style>
</head>

<body class="text-slate-800">
    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-[#2C333A] text-white flex flex-col h-screen sticky top-0" data-purpose="main-sidebar">
            <div class="p-6 mb-4">
                <div class="flex items-start">
                    <div class="mr-3 mt-1">
                        <svg class="w-5 h-5 text-[#FF7043]" fill="currentColor" viewbox="0 0 24 24">
                            <path
                                d="M11 5v11.17l-4.88-4.88c-.39-.39-1.03-.39-1.42 0-.39.39-.39 1.02 0 1.41l6.59 6.59c.39.39 1.02.39 1.41 0l6.59-6.59c.39-.39.39-1.02 0-1.41-.39-.39-1.03-.39-1.42 0L13 16.17V5c0-.55-.45-1-1-1s-1 .45-1 1z">
                            </path>
                        </svg>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold leading-tight">Bitis's<br />Management</h2>
                        <p class="text-xs text-slate-400 mt-1">System Terminal</p>
                    </div>
                </div>
            </div>
            <nav class="flex-1 px-0 space-y-0.5" data-purpose="sidebar-nav">
                <a class="flex items-center px-6 py-3 text-sm font-semibold bg-white/10 border-l-4 border-[#E30016] text-white transition"
                    href="index.html">
                    <svg class="w-5 h-5 mr-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                        <path
                            d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"
                            stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                    </svg>
                    Dashboard
                </a>
                <a class="flex items-center px-6 py-3 text-sm font-medium text-slate-300 hover:bg-slate-700/50 transition"
                    href="product_catalog.html">
                    <svg class="w-5 h-5 mr-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                        <path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" stroke-linecap="round"
                            stroke-linejoin="round" stroke-width="2"></path>
                    </svg>
                    Products
                </a>
                <a class="flex items-center px-6 py-3 text-sm font-medium text-slate-300 hover:bg-slate-700/50 transition"
                    href="inventory_tracker.html">
                    <svg class="w-5 h-5 mr-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                        <path
                            d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4a2 2 0 012-2m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"
                            stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                    </svg>
                    Inventory
                </a>
                <a class="flex items-center px-6 py-3 text-sm font-medium text-slate-300 hover:bg-slate-700/50 transition"
                    href="order_management.html">
                    <svg class="w-5 h-5 mr-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                        <path
                            d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"
                            stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                    </svg>
                    Orders
                </a>
            </nav>
            <div class="px-0 py-4 space-y-0.5 border-t border-slate-700/30">
                <a class="flex items-center px-6 py-3 text-sm font-medium text-slate-300 hover:bg-slate-700/50 transition"
                    href="staff_management.html">
                    <svg class="w-5 h-5 mr-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                        <path
                            d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"
                            stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                    </svg>
                    Staff Management
                </a>
                <a onclick="window.supabaseClient.auth.signOut().then(() => window.location.href='login.html')"
                    class="flex items-center px-6 py-3 text-sm font-medium text-slate-300 hover:bg-slate-700/50 transition cursor-pointer">
                    <svg class="w-5 h-5 mr-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
                        <path
                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
                            stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                    </svg>
                    Sign Out
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-screen overflow-hidden">
            <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8">
                <div></div>
                <div class="flex items-center space-x-6">
                    <a href="profile.html" class="flex items-center space-x-3 hover:bg-slate-50 p-1 rounded-lg transition">
                        <img id="adminAvatar" alt="Admin" class="w-10 h-10 rounded-full border border-slate-200 object-cover"
                            src="https://via.placeholder.com/40" />
                        <div class="text-left">
                            <p id="adminName" class="text-sm font-bold text-slate-800 leading-tight">Admin User</p>
                            <p id="adminEmail" class="text-xs text-slate-400">admin@bitis.com.vn</p>
                        </div>
                    </a>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto p-8 bg-slate-50/50">
                <h1 id="welcomeMessage" class="text-2xl font-bold text-slate-900 mb-8">Welcome Back, Admin</h1>

                <div class="grid grid-cols-12 gap-6">
                    <!-- Stats Section -->
                    <div class="col-span-12 grid grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                            <p class="text-slate-400 text-sm font-medium">Total Orders</p>
                            <h3 id="totalOrders" class="text-3xl font-bold mt-2">0</h3>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                            <p class="text-slate-400 text-sm font-medium">Total Revenue</p>
                            <h3 id="totalRevenue" class="text-3xl font-bold mt-2">0 VND</h3>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                            <p class="text-slate-400 text-sm font-medium">Avg. Order Value</p>
                            <h3 id="avgOrderValue" class="text-3xl font-bold mt-2">0 VND</h3>
                        </div>
                    </div>

                    <!-- Recent Orders Table -->
                    <div class="col-span-12 bg-white p-8 rounded-2xl border border-slate-100 shadow-sm">
                        <h4 class="text-lg font-bold mb-6">Recent Operations</h4>
                        <table class="w-full text-left">
                            <thead>
                                <tr
                                    class="text-[11px] uppercase tracking-wider text-slate-400 border-b border-slate-50">
                                    <th class="pb-4 font-semibold">Order ID</th>
                                    <th class="pb-4 font-semibold">Customer</th>
                                    <th class="pb-4 font-semibold">Date</th>
                                    <th class="pb-4 font-semibold">Status</th>
                                    <th class="pb-4 font-semibold">Amount</th>
                                </tr>
                            </thead>
                            <tbody id="recentOpsTableBody" class="text-sm">
                                <!-- Dynamic rows -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        async function fetchDashboardData() {
            try {
                const { data: orders, error: ordersError } = await window.supabaseClient
                    .from('orders')
                    .select('*, customers(*)')
                    .order('created_at', { ascending: false });

                if (ordersError) throw ordersError;

                if (orders) {
                    const totalOrders = orders.length;
                    const totalRevenue = orders.reduce((acc, o) => acc + Number(o.total_amount), 0);
                    const avgValue = totalOrders > 0 ? totalRevenue / totalOrders : 0;

                    document.getElementById('totalOrders').innerText = totalOrders.toLocaleString();
                    document.getElementById('totalRevenue').innerText = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(totalRevenue);
                    document.getElementById('avgOrderValue').innerText = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(avgValue);

                    const tbody = document.getElementById('recentOpsTableBody');
                    tbody.innerHTML = '';
                    orders.slice(0, 5).forEach(order => {
                        const date = new Date(order.created_at).toLocaleDateString('vi-VN');
                        const amount = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(order.total_amount);

                        let statusClass = 'bg-slate-100 text-slate-500';
                        if (order.status === 'Completed' || order.status === 'Delivered') statusClass = 'bg-green-100 text-green-700';
                        if (order.status === 'Shipping' || order.status === 'Shipped') statusClass = 'bg-blue-100 text-blue-700';
                        if (order.status === 'Pending' || order.status === 'Processing') statusClass = 'bg-yellow-100 text-amber-700';
                        if (order.status === 'Cancelled') statusClass = 'bg-red-100 text-red-700';

                        const tr = document.createElement('tr');
                        tr.className = 'border-b border-slate-50 hover:bg-slate-50 transition-colors';
                        tr.innerHTML = `
                            <td class="py-4 font-semibold">#${order.order_number}</td>
                            <td class="py-4">${order.customers ? order.customers.full_name : 'Unknown'}</td>
                            <td class="py-4 text-slate-500">${date}</td>
                            <td class="py-4">
                                <span class="px-2 py-1 ${statusClass} text-[10px] font-bold rounded-full">${order.status}</span>
                            </td>
                            <td class="py-4 font-bold">${amount}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }

                const { data: { session } } = await window.supabaseClient.auth.getSession();
                if (session) {
                    const { data: profile } = await window.supabaseClient
                        .from('user_profiles')
                        .select('*')
                        .eq('id', session.user.id)
                        .single();

                    if (profile) {
                        document.getElementById('adminName').innerText = profile.full_name;
                        document.getElementById('adminEmail').innerText = session.user.email;
                        document.getElementById('welcomeMessage').innerText = `Welcome Back, ${profile.full_name.split(' ')[0]}`;
                        if (profile.avatar_url) {
                            document.getElementById('adminAvatar').src = profile.avatar_url;
                        }
                    }
                }

            } catch (error) {
                console.error('Error fetching dashboard data:', error);
            }
        }

        fetchDashboardData();
    </script>
</body>

</html>
